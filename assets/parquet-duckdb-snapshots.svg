<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Parquet snapshots served through DuckDB</title>
  <desc id="desc">The warehouse writes Parquet snapshots to S3, and the API queries the newest one through views in an in-memory DuckDB instance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="220" fill="#ffffff"/>

  <!-- Data warehouse -->
  <rect x="10" y="88" width="108" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="64" y="113" text-anchor="middle" font-size="11" font-weight="600" fill="#111">Data warehouse</text>
  <text x="64" y="129" text-anchor="middle" font-size="9" fill="#555">dbt builds models</text>

  <line x1="118" y1="116" x2="164" y2="116" stroke="#555" marker-end="url(#arrow)"/>
  <text x="141" y="108" text-anchor="middle" font-size="8" fill="#555">UNLOAD</text>
  <text x="141" y="130" text-anchor="middle" font-size="8" fill="#555">daily</text>

  <!-- S3 bucket -->
  <rect x="166" y="16" width="168" height="190" rx="8" fill="#fff7ed" stroke="#f0a35e"/>
  <text x="250" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#111">S3 bucket</text>
  <text x="250" y="47" text-anchor="middle" font-size="8.5" fill="#555">immutable snapshots</text>
  <rect x="179" y="56" width="142" height="20" rx="4" fill="#ffffff" stroke="#f0a35e"/>
  <text x="250" y="69" text-anchor="middle" font-size="8.5" fill="#333">index of complete snapshots</text>
  <rect x="190" y="88" width="134" height="110" rx="4" fill="#fde5cc" stroke="#f0a35e"/>
  <rect x="184" y="94" width="134" height="106" rx="4" fill="#ffffff" stroke="#f0a35e"/>
  <text x="251" y="109" text-anchor="middle" font-size="9.5" font-weight="600" fill="#111">newest snapshot</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#333">
    <text x="192" y="126">manifest.json</text>
    <text x="192" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#555">row counts, part sizes</text>
    <text x="192" y="156">dataset_a/part_*.parquet</text>
    <text x="192" y="168">dataset_b/part_*.parquet</text>
    <text x="192" y="181">…</text>
  </g>

  <line x1="334" y1="116" x2="382" y2="116" stroke="#555" marker-end="url(#arrow)"/>
  <text x="358" y="108" text-anchor="middle" font-size="8" fill="#555">read-only</text>
  <text x="358" y="130" text-anchor="middle" font-size="8" fill="#555">mount</text>

  <!-- API service -->
  <rect x="384" y="16" width="200" height="190" rx="8" fill="#eff6ff" stroke="#93b4dd"/>
  <text x="484" y="34" text-anchor="middle" font-size="11" font-weight="600" fill="#111">API service</text>
  <text x="484" y="47" text-anchor="middle" font-size="8.5" fill="#555">Node.js container</text>

  <rect x="398" y="55" width="172" height="44" rx="4" fill="#ffffff" stroke="#93b4dd"/>
  <text x="484" y="69" text-anchor="middle" font-size="9.5" font-weight="600" fill="#111">Snapshot poller</text>
  <text x="484" y="81" text-anchor="middle" font-size="8" fill="#333">checks for new snapshots</text>
  <text x="484" y="92" text-anchor="middle" font-size="8" fill="#333">verifies row counts</text>
  <line x1="484" y1="99" x2="484" y2="110" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="398" y="112" width="172" height="48" rx="4" fill="#fefce8" stroke="#e5cf6b"/>
  <text x="484" y="127" text-anchor="middle" font-size="9.5" font-weight="600" fill="#111">DuckDB (in-memory)</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="7.5" fill="#333" text-anchor="middle">
    <text x="484" y="141">CREATE VIEW … AS SELECT *</text>
    <text x="484" y="152">FROM read_parquet([parts])</text>
  </g>
  <line x1="484" y1="176" x2="484" y2="162" stroke="#555" marker-end="url(#arrow)"/>
  <rect x="398" y="176" width="172" height="20" rx="4" fill="#ffffff" stroke="#93b4dd"/>
  <text x="484" y="189" text-anchor="middle" font-size="8.5" fill="#333">parameterized SQL per request</text>

  <line x1="586" y1="116" x2="622" y2="116" stroke="#555" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="604" y="108" text-anchor="middle" font-size="8" fill="#555">JSON</text>

  <!-- Browser -->
  <rect x="624" y="88" width="66" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="657" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#111">Browser</text>
</svg>
