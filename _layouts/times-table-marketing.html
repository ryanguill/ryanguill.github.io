<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Times Table Unleashed makes multiplication practice feel like play.">
    <title>{{ page.title }}</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #f8f6ff; color: #171d5b; font-family: "Avenir Next", Avenir, "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif; }
      a { color: inherit; }
      .ttu { overflow: hidden; }
      .ttu-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
      .ttu-nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; position: relative; z-index: 2; }
      .ttu-brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; font-size: .91rem; line-height: .95; font-weight: 900; letter-spacing: .01em; }
      .ttu-brand img { width: 45px; height: 45px; border-radius: 13px; box-shadow: 0 7px 0 #27316c; }
      .ttu-brand span span { color: #7251ef; }
      .ttu-nav-link { font-weight: 800; text-decoration: none; color: #6044d7; font-size: .92rem; }
      .ttu-hero { position: relative; padding: 36px 0 96px; background: radial-gradient(circle at 8% 26%, #ffe8a1 0 10%, transparent 10.2%), radial-gradient(circle at 90% 8%, #d8d0ff 0 13%, transparent 13.2%), linear-gradient(146deg, #fffaf0 0%, #f7f2ff 48%, #ddf4ff 100%); }
      .ttu-hero::after { content: ""; position: absolute; inset: auto -10% -95px; height: 190px; border-radius: 50% 50% 0 0; background: #fff; transform: rotate(-3deg); }
      .ttu-hero-grid { display: grid; align-items: center; grid-template-columns: 1.05fr .95fr; gap: 34px; position: relative; z-index: 1; }
      .ttu-kicker { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #fff; color: #f04eaa; border-radius: 999px; font-size: .77rem; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; box-shadow: 0 6px 18px #48309614; }
      .ttu-kicker::before { content: "✦"; color: #ffbd22; font-size: 1rem; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { max-width: 660px; margin: 17px 0 20px; font-size: clamp(3rem, 6.7vw, 5.7rem); letter-spacing: -.075em; line-height: .93; font-weight: 900; }
      h1 em { display: block; color: #7052ee; font-style: normal; }
      .ttu-lede { max-width: 560px; color: #5f6385; font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.55; }
      .ttu-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 29px; }
      .ttu-button { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 22px; border-radius: 17px; background: #7451ed; color: #fff; box-shadow: inset 0 -6px 0 #4230ad, 0 10px 20px #6e4be033; text-decoration: none; font-weight: 900; }
      .ttu-button:hover { transform: translateY(-2px); }
      .ttu-button-secondary { background: #fff; color: #4938a9; box-shadow: 0 7px 0 #e6e0ff; }
      .ttu-button-coming-soon { background: #fff; color: #5a48b7; box-shadow: 0 7px 0 #e7e0ff; cursor: default; }
      .ttu-mini-note { margin: 14px 0 0; color: #767995; font-size: .84rem; font-weight: 700; }
      .ttu-stage { min-height: 530px; position: relative; }
      .ttu-phone { position: absolute; z-index: 2; width: min(274px, 65vw); right: 12%; top: 10px; padding: 9px; background: #182063; border: 7px solid #182063; border-radius: 42px; box-shadow: 20px 30px 0 #bfdcf4, 0 20px 36px #31268034; transform: rotate(6deg); animation: ttu-float 5s ease-in-out infinite; }
      .ttu-phone::before { content: ""; width: 31%; height: 18px; border-radius: 0 0 13px 13px; background: #182063; position: absolute; top: -6px; left: 34.5%; z-index: 1; }
      .ttu-phone img { display: block; width: 100%; border-radius: 27px; }
      .ttu-fact { position: absolute; z-index: 3; display: grid; place-items: center; width: 92px; height: 60px; border-radius: 21px; background: #fff; box-shadow: 0 12px 20px #442d9017; font-size: 1.3rem; font-weight: 900; }
      .ttu-fact-one { top: 44px; left: 3%; color: #f256b4; transform: rotate(-10deg); animation: ttu-bob 4.2s ease-in-out infinite; }
      .ttu-fact-two { top: 255px; left: 0; color: #5550d9; transform: rotate(9deg); animation: ttu-bob 5.3s -1s ease-in-out infinite; }
      .ttu-fact-three { right: 2%; bottom: 36px; color: #dc8d00; transform: rotate(-7deg); animation: ttu-bob 4.6s -.4s ease-in-out infinite; }
      .ttu-rocket { position: absolute; right: 4%; top: 20%; z-index: 4; font-size: 3.1rem; transform: rotate(18deg); animation: ttu-rocket 6.3s ease-in-out infinite; }
      .ttu-section { padding: 96px 0; }
      .ttu-section-heading { max-width: 690px; margin: 0 auto 42px; text-align: center; }
      .ttu-section-heading .eyebrow { color: #f14ba7; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; font-size: .75rem; }
      h2 { margin: 10px 0 13px; font-size: clamp(2.15rem, 4.7vw, 3.9rem); letter-spacing: -.055em; line-height: .97; }
      .ttu-section-heading p { color: #6e718f; font-size: 1.08rem; line-height: 1.6; }
      .ttu-feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }
      .ttu-feature { min-height: 240px; padding: 28px; border-radius: 30px; background: #fff; box-shadow: 0 12px 28px #34256e0c; }
      .ttu-feature:nth-child(1) { border-top: 7px solid #ffd347; }
      .ttu-feature:nth-child(2) { border-top: 7px solid #fb75ba; }
      .ttu-feature:nth-child(3) { border-top: 7px solid #7154ed; }
      .ttu-feature-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 18px; background: #f5f1ff; color: #7352ed; font-size: 1.75rem; }
      h3 { margin: 22px 0 9px; font-size: 1.25rem; letter-spacing: -.025em; }
      .ttu-feature p { margin: 0; color: #747791; line-height: 1.55; }
      .ttu-screens { position: relative; padding: 94px 0; background: #1e286d; color: #fff; }
      .ttu-screens::before { content: "×  ✦  6 × 7  ✦  9 × 4  ✦"; position: absolute; inset: 34px 0 auto; color: #ffffff1c; white-space: nowrap; font-size: clamp(2rem, 6vw, 5rem); font-weight: 900; letter-spacing: .04em; }
      .ttu-screens .ttu-section-heading { position: relative; z-index: 1; }
      .ttu-screens .eyebrow { color: #ffd84f; }
      .ttu-screens .ttu-section-heading p { color: #c5c9ef; }
      .ttu-screen-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: start; position: relative; z-index: 1; }
      .ttu-screen { overflow: hidden; border: 6px solid #fff; border-radius: 27px; box-shadow: 0 18px 35px #0000003d; background: #fff; transform: translateY(var(--lift, 0)); }
      .ttu-screen:nth-child(2) { --lift: 34px; } .ttu-screen:nth-child(3) { --lift: 12px; } .ttu-screen:nth-child(4) { --lift: 48px; }
      .ttu-screen img { display: block; width: 100%; }
      .ttu-facts { display: grid; grid-template-columns: .95fr 1.05fr; gap: 48px; align-items: center; }
      .ttu-facts-card { padding: 35px; border-radius: 35px; background: linear-gradient(135deg, #fff5d7, #e8e1ff); }
      .ttu-facts-card .ttu-big-fact { display: grid; place-items: center; width: 200px; height: 200px; margin: 0 auto; border-radius: 50%; background: #7154ed; color: #fff; box-shadow: 12px 15px 0 #4a36b7; font-size: 3.55rem; font-weight: 900; transform: rotate(-6deg); }
      .ttu-checklist { margin: 22px 0 0; padding: 0; list-style: none; }
      .ttu-checklist li { display: flex; align-items: center; gap: 11px; margin: 12px 0; color: #5e6280; font-weight: 700; }
      .ttu-checklist li::before { content: "✓"; display: grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; background: #dcf6cf; color: #39844a; font-weight: 900; }
      .ttu-cta { padding: 52px 0 80px; text-align: center; }
      .ttu-cta-box { padding: 54px 25px; border-radius: 37px; color: #fff; background: linear-gradient(135deg, #fb55b1, #7650eb); box-shadow: 0 18px 0 #5526b8; }
      .ttu-cta-box h2 { max-width: 620px; margin: 0 auto 16px; }
      .ttu-cta-box p { max-width: 610px; margin: 0 auto 27px; color: #fff8fd; font-size: 1.08rem; }
      .ttu-cta-box .ttu-button { background: #fff; color: #5639be; box-shadow: 0 7px 0 #e8dfff; }
      .ttu-footer { padding: 28px 0 42px; color: #747791; font-size: .86rem; text-align: center; }
      @keyframes ttu-float { 50% { transform: rotate(4deg) translateY(-13px); } }
      @keyframes ttu-bob { 50% { translate: 0 -12px; } }
      @keyframes ttu-rocket { 50% { translate: 12px -20px; rotate: -8deg; } }
      @media (max-width: 760px) { .ttu-shell { width: min(100% - 28px, 530px); } .ttu-nav { padding: 17px 0; } .ttu-hero { padding-top: 10px; padding-bottom: 73px; } .ttu-hero-grid, .ttu-facts { grid-template-columns: 1fr; } h1 { margin-top: 15px; font-size: clamp(3.2rem, 16vw, 4.8rem); } .ttu-lede { font-size: 1.03rem; } .ttu-actions { display: grid; grid-template-columns: 1fr; } .ttu-button { width: 100%; } .ttu-stage { min-height: 402px; margin-top: -12px; } .ttu-phone { width: min(230px, 60vw); right: 15%; top: 6px; } .ttu-fact { width: 77px; height: 51px; font-size: 1.1rem; } .ttu-fact-one { top: 39px; left: 2%; } .ttu-fact-two { top: 248px; left: 3%; } .ttu-fact-three { bottom: 28px; right: 0; } .ttu-rocket { right: 3%; top: 20%; font-size: 2.45rem; } .ttu-section, .ttu-screens { padding: 70px 0; } .ttu-feature-grid { grid-template-columns: 1fr; } .ttu-feature { min-height: 0; padding: 24px; } .ttu-screen-row { grid-template-columns: repeat(2, 1fr); gap: 13px; } .ttu-screen:nth-child(2), .ttu-screen:nth-child(3), .ttu-screen:nth-child(4) { --lift: 0; } .ttu-facts-card { order: 2; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
