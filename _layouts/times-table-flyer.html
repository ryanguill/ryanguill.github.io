<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #e7e3f6; color: #171d5b; font-family: "Avenir Next", Avenir, "Arial Rounded MT Bold", system-ui, sans-serif; }
      .print-controls { position: fixed; z-index: 5; right: 18px; top: 18px; padding: 11px 14px; border: 0; border-radius: 12px; background: #7154ed; color: #fff; font: 800 14px inherit; box-shadow: 0 6px 15px #33277033; cursor: pointer; }
      .flyer-sheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: .12in; width: min(11in, calc(100vw - 24px)); min-height: 8.5in; margin: 12px auto; padding: .1in; background: #fff; }
      .flyer { position: relative; min-width: 0; min-height: 8.05in; padding: .26in .26in .2in; overflow: hidden; border: 2px dashed #d6cffa; background: linear-gradient(155deg, #fff9e5 0%, #f9f4ff 48%, #dff5ff 100%); }
      .flyer::before { content: ""; position: absolute; width: 3.4in; height: 1.7in; left: -.7in; top: 1.4in; border-radius: 50%; background: #ffe49b; opacity: .55; transform: rotate(17deg); }
      .flyer::after { content: "✦   ·   ✦"; position: absolute; top: .14in; right: .2in; color: #f856ae; font-size: .26in; letter-spacing: .05in; }
      .flyer-content { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 7.59in; }
      .flyer-brand { display: flex; align-items: center; gap: .12in; font-size: .19in; line-height: .95; font-weight: 900; letter-spacing: .005in; }
      .flyer-brand img { width: .52in; height: .52in; border-radius: .15in; box-shadow: 0 .05in 0 #2a3470; }
      .flyer-brand span span { color: #7650eb; }
      .flyer h1 { width: 58%; margin: .3in 0 .12in; font-size: .45in; line-height: .91; letter-spacing: -.04in; }
      .flyer h1 strong { color: #7154ed; letter-spacing: -.01in; }
      .flyer .tagline { width: 53%; margin: 0; color: #363a54; font-size: .145in; line-height: 1.35; font-weight: 700; }
      .phone { position: absolute; right: .23in; top: 1.04in; width: 1.18in; padding: .05in; border: .08in solid #1c2669; border-radius: .25in; background: #1c2669; box-shadow: .13in .16in 0 #bddcf1; transform: rotate(7deg); }
      .phone img { display: block; width: 100%; border-radius: .17in; }
      .fact-chip { position: absolute; right: 1.16in; top: 2.27in; display: grid; place-items: center; width: .62in; height: .4in; border-radius: .14in; color: #f257b0; background: #fff; box-shadow: 0 .06in .1in #412a851c; font-size: .155in; font-weight: 900; transform: rotate(-10deg); }
      .benefits { display: grid; grid-template-columns: repeat(2, 1fr); gap: .1in; margin: .49in 0 .25in; padding: 0; list-style: none; }
      .benefits li { min-height: .76in; padding: .12in; border-radius: .17in; color: #30344c; font-size: .125in; line-height: 1.24; font-weight: 800; box-shadow: 0 .04in .1in #3521680d; }
      .benefits li:nth-child(1) { background: linear-gradient(145deg, #fff8d8, #fff0ae); border: 1px solid #f7dd70; }
      .benefits li:nth-child(2) { background: linear-gradient(145deg, #fff0fa, #ffd8ee); border: 1px solid #f7a8d3; }
      .benefits li:nth-child(3) { background: linear-gradient(145deg, #f1efff, #ddd8ff); border: 1px solid #bfb4fb; }
      .benefits li:nth-child(4) { background: linear-gradient(145deg, #effaff, #d2edff); border: 1px solid #9bd2f3; }
      .benefits b { display: block; margin-bottom: .025in; color: #1c2669; font-size: .14in; }
      .flyer-bottom { position: relative; display: grid; grid-template-columns: 1fr 1.18in; gap: .14in; align-items: center; margin-top: auto; padding: .16in .15in .15in; border: 2px solid #c7bafb; border-radius: .22in; background: #fffdf8; }
      .flyer-bottom::before { content: "✦  PLAY · LEARN · GROW  ✦"; position: absolute; top: -.31in; left: 50%; color: #8a73e9; background: #f6f1ff; padding: .03in .12in; border-radius: 99px; font-size: .09in; font-weight: 900; letter-spacing: .015in; white-space: nowrap; transform: translateX(-50%); }
      .flyer-bottom h2 { margin: 0 0 .045in; font-size: .2in; letter-spacing: -.01in; }
      .flyer-bottom p { margin: 0; color: #363a54; font-size: .12in; line-height: 1.3; font-weight: 700; }
      .qr-code-link { display: block; width: 1.08in; height: 1.08in; padding: .035in; background: #fff; border: .04in solid #171d5b; box-shadow: 0 .04in .08in #3327701a; }
      .qr-code { display: block; width: 100%; height: 100%; }
      @page { size: letter landscape; margin: .1in; }
      @media print { body { background: #fff; } .print-controls { display: none; } .flyer-sheet { width: 10.8in; min-height: 8.3in; margin: 0; padding: 0; gap: .1in; } .flyer { min-height: 8.3in; border-color: #cabff5; } }
      @media (max-width: 800px) { .flyer-sheet { grid-template-columns: 1fr; width: min(5.4in, calc(100vw - 24px)); } .flyer { min-height: 8.05in; } }
    </style>
  </head>
  <body>
    <button class="print-controls" type="button" onclick="window.print()">Print two flyers</button>
    {{ content }}
  </body>
</html>
