<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index, follow">
    <title>{{ page.title }}</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        background: #fafafa;
        color: #1d1d1f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.65;
      }
      main { max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }
      h1 { font-size: clamp(2rem, 6vw, 2.7rem); line-height: 1.15; margin: 0 0 8px; }
      h2 { font-size: 1.35rem; line-height: 1.3; margin-top: 2.2rem; }
      a { color: #5d3fd3; }
      .updated { color: #6e6e73; margin-top: 0; }
      .summary { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
