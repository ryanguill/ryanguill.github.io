# External plugins
plugins:
  - jekyll-archives # works because Pages builds via GitHub Actions, not the github-pages gem
  - jekyll-sitemap

exclude:
  - "/vendor/"
  - "AGENTS.md"
  - "README.md"
  - "LICENSE.md"
  - ".plans/"
  - ".github/"
  - "Gemfile"
  - "Gemfile.lock"
  - ".ruby-version"

# Site settings
title: TIL
subtitle: "My Thoughts, Opinions, Learnings and Discoveries"
email: ryanguill@gmail.com
name: Ryan Guill
description: >
  A place to share My Thoughts, Opinions, Learnings and Discoveries.
# Base URL of site (i.e. /blog). It should always start with a slash,
# and never end with a slash. Set it to a blank value if hosting at the
# root of your server.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://ryanguill.com" # the base hostname & protocol for your site
cover: "/assets/blog-header-cuttlefish.jpg"
logo: "/assets/cuttlefish-icon-edit.png"
times_table_unleashed_app_store_url: "https://apps.apple.com/app/apple-store/id6794184709?pt=129215200&ct=website&mt=8"
times_table_unleashed_flyer_app_store_url: "https://apps.apple.com/app/apple-store/id6794184709?pt=129215200&ct=flyer&mt=8"

# Build settings
markdown: kramdown
inter_post_navigation: true
excerpt_separator: <!-- break -->

# Archive settings (see https://github.com/jekyll/jekyll-archives/)
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: 'archive'
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

# Google Analytics 4 measurement ID (looks like "G-XXXXXXXXXX").
# Only loaded in production builds (JEKYLL_ENV=production). Leave empty to disable.
google_analytics_id: "G-4F03N3ZJZD"

# Social icons and sharing options
#
# Social settings are used in two places:
# * In the footer, as links to your personal profiles
# * After each blog post for sharing widgets
#
# Example:
#
# social:
#   - name: Twitter                         # Name of the service
#     icon: twitter                         # Font Awesome icon to use (minus fa- prefix)
#     username: "@TheBenCentra"             # (User) Name to display in the footer link
#     url: https://twitter.com/TheBenCentra # URL of your profile (leave blank to not display in footer)
#     desc: Follow me on Twitter            # Description to display as link title, etc
#     share: true                           # Include in the "Share" section of posts
social:
  - name: Twitter
    icon: twitter
    username: ryanguill
    url: https://twitter.com/ryanguill
    desc: Follow me on Twitter
    share: true

  - name: GitHub
    icon: github
    username: ryanguill
    url: https://github.com/ryanguill
    desc: Fork me on GitHub
    share: false

  - name: LinkedIn
    icon: linkedin
    username: Ryan Guill
    url: https://www.linkedin.com/in/ryan-guill-92034a1
    desc: Connect with me on LinkedIn
    share: true

  - name: Instagram
    icon: instagram
    username: mryanguill
    url: https://www.instagram.com/mryanguill/
    desc: Follow me on Instagram
    share: false

# Social preview metadata is generated from:
# 1) post `cover` image, else
# 2) site `cover`, else
# 3) site `logo`
