<header class="navigation{% if include.overlay %} is-overlay{% endif %}" role="banner">
  <div class="wrapper navigation-wrapper">
    <a href="{{ site.baseurl }}/" class="brand">
      {% if site.logo %}<img src="{{ site.logo | prepend: site.baseurl }}" alt="">{% endif %}
      <span>{{ site.name }}</span>
    </a>
    <nav role="navigation" aria-label="Main">
      <ul class="navigation-menu">
        <li><a href="{{ "/posts/" | prepend: site.baseurl }}"{% if page.url == "/posts/" %} aria-current="page"{% endif %}>writing</a></li>
        <li><a href="{{ "/about/" | prepend: site.baseurl }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>about</a></li>
        <li><a href="{{ "/resume/" | prepend: site.baseurl }}"{% if page.url contains "/resume/" %} aria-current="page"{% endif %}>résumé</a></li>
        <li><a href="{{ "/feed.xml" | prepend: site.baseurl }}">rss</a></li>
      </ul>
    </nav>
  </div>
</header>
