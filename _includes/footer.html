<footer class="site-footer">
  <div class="wrapper">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }} &middot; Memphis, TN</span>
    <nav aria-label="Elsewhere">
      <a href="mailto:{{ site.email }}">email</a>
      {% for social in site.social %}{% if social.url %}<a href="{{ social.url }}" title="{{ social.desc }}">{{ social.name | downcase }}</a>{% endif %}{% endfor %}
      <a href="{{ "/feed.xml" | prepend: site.baseurl }}">rss</a>
    </nav>
  </div>
</footer>
